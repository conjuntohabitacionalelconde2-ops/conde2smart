<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONDE 2 SMART</title>
  <style>
    :root {
      --bg-color: #FDFBF7;
      --card-bg: #FFFFFF;
      --primary: #FF6B00;
      --primary-dark: #E05E00;
      --text-main: #333333;
      --text-muted: #666666;
      --border: #E8E2D5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 30px; }

    header {
      background-color: var(--primary);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    header h1 { font-size: 1.4rem; font-weight: bold; }
    .role-badge { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; }

    nav {
      display: flex;
      background-color: #F4EFE6;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    nav button {
      background: none;
      border: none;
      padding: 12px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    nav button.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
      background-color: var(--card-bg);
    }
